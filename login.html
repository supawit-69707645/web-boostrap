<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
     <div class="container  ">

        <div class="row  ">
            <div class="col-md-6 mx-auto mt-5 bg-light   rounded">
                <div class="h3 text-center	text-primary mt-3 ">Sign In</div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="" required>
                </div>
                <div class="mb-3     mt-4 ">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="" required>
                </div>
                <div class="text-center mb-4">
                <a href="product.html"><input type="submit" id="submit" class="btn btn-primary" value="Login"></a>
                    <input type="reset" id="cancel" class="btn btn-danger" value="Clear">
                </div>
                <a href="register.html">Sign up</a>
                
            </div>
        </div>
    </div>
</body>
</html>
